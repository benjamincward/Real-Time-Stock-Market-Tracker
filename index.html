<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Stock Market Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">Real-time Stock Market Tracker</h1>
                <div class="timestamp" id="last-updated">Last updated: --:--:--</div>
            </div>
        </header>

        <div class="grid-layout">
            <div class="card">
                <h2 class="card-title">Stock Tickers</h2>
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input"
                        placeholder="Add stock symbol (e.g., AAPL)">
                    <button id="search-button" class="search-button">Add</button>
                </div>
                <div id="error-container"></div>
                <div class="stock-list" id="stock-list">
                    <div class="loading">Loading stocks</div>
                </div>
            </div>

            <div class="card">
                <div id="stock-details-container">
                    <div class="empty-state">
                        Select a stock to view details
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="config.js"></script>
    <script src="config.local.js"></script>
    <script src="api.js"></script>
    <script src="chart.js"></script>
    <script src="app.js"></script>
</body>

</html>
